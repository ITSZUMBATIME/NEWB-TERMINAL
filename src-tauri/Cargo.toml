[package]
name = "akin-terminal"
version = "0.1.0"
description = "AKIN: a beginner-friendly terminal"
edition = "2021"

[lib]
name = "akin_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2", features = [] }
