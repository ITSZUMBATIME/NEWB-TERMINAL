[package]
name = "newb-terminal"
version = "0.1.0"
description = "NEWB: a beginner-friendly terminal"
edition = "2021"

[lib]
name = "newb_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ignore = "0.4.34"
portable-pty = "0.9.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2", features = [] }
trash = "5.2.9"
