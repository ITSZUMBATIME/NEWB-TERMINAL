<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEWB</title>
  </head>
  <body>
    <div id="app">
      <div id="tabbar">
        <button id="open-files" class="bar-btn" data-icon="files" title="Files (Ctrl+Shift+E)"><span>Files</span></button>
        <div id="tabs"></div>
        <button id="new-tab" data-icon="plus" title="New tab (Ctrl+Shift+T)" aria-label="New tab"></button>
        <button id="open-cheats" class="bar-btn" data-icon="commands" title="Cheat sheet (Ctrl+Shift+S)"><span>Cheat sheet</span></button>
        <button id="open-keys" class="bar-btn" data-icon="keyboard" title="Shortcuts (Ctrl+Shift+K)"><span>Shortcuts</span></button>
        <button id="toggle-split" class="bar-btn icon-only" data-icon="split" title="Editor beside terminal (Ctrl+Shift+B)" aria-label="Editor beside terminal"></button>
        <button id="open-settings" class="bar-btn icon-only" data-icon="settings" title="Settings (Ctrl+,)" aria-label="Settings"></button>
      </div>

      <div id="hero" data-logo="code" data-layout="pinned">
        <div id="logo-wrap">
          <canvas id="ascii-logo" title="Click to try another logo style"></canvas>
        </div>
        <div id="info">
          <div id="info-inner">
            <div id="info-title"></div>
            <div id="info-cols">
              <div class="col" id="info-left"></div>
              <div class="col" id="info-right"></div>
            </div>
            <div id="palette" class="palette"></div>
          </div>
        </div>
      </div>

      <div id="workspace">
        <!-- Left: file explorer. Docked, so it pushes the terminal across. -->
        <aside id="explorer" aria-label="Files" aria-hidden="false">
          <nav class="subtabs fx-subtabs">
            <button class="subtab on" data-fxview="files">Files</button>
            <button class="subtab" data-fxview="repos">Repos</button>
            <button class="subtab" data-fxview="search">Search</button>
          </nav>

          <div id="fx-view-files" class="fx-view">
            <div class="fx-head">
              <button id="fx-home" class="fx-btn" data-icon="home" title="Home folder" aria-label="Home folder"></button>
              <button id="fx-up" class="fx-btn" data-icon="up" title="Up one folder" aria-label="Up one folder"></button>
              <div id="fx-path" class="fx-path"></div>
              <button id="fx-follow" class="fx-btn" data-icon="follow" title="Follow the folder the terminal is in" aria-label="Follow the terminal"></button>
              <button id="fx-hidden" class="fx-btn" data-icon="eye" title="Show hidden files" aria-label="Show hidden files"></button>
              <button id="fx-refresh" class="fx-btn" data-icon="refresh" title="Refresh" aria-label="Refresh"></button>
            </div>
            <div id="fx-tree" class="fx-tree"></div>
          </div>

          <div id="fx-view-repos" class="fx-view" hidden>
            <div class="fx-head">
              <div class="fx-path">Your projects</div>
              <button id="rp-add" class="fx-btn" data-icon="plus" title="Add a folder that holds projects" aria-label="Add a folder"></button>
              <button id="rp-refresh" class="fx-btn" data-icon="refresh" title="Look again" aria-label="Look again"></button>
            </div>
            <div id="rp-list" class="fx-tree"></div>
          </div>
          <div id="fx-view-search" class="fx-view" hidden>
            <div class="sr-head">
              <div class="sr-box">
                <input id="sr-input" class="sr-input" type="text" placeholder="Find text in a project" autocomplete="off" spellcheck="false">
                <button id="sr-case" class="sr-tg" title="Match capital letters">Aa</button>
                <button id="sr-word" class="sr-tg" title="Whole word only">ab</button>
                <button id="sr-regex" class="sr-tg" title="Use a pattern (regular expression)">.*</button>
              </div>
              <select id="sr-scope" class="sr-scope" title="Where to look"></select>
            </div>
            <div id="sr-summary" class="sr-summary"></div>
            <div id="sr-results" class="fx-tree"></div>
          </div>
          <div id="fx-resize" class="fx-resize" title="Drag to resize"></div>
        </aside>
        <div id="panes"><div id="split-handle" hidden title="Drag to resize"></div></div>
      </div>

      <div id="logo-toast"></div>

      <!-- Right: slide-over panel. Two tabs: the cheat sheet and the shortcut list. -->
      <aside id="drawer-cheats" class="drawer right" aria-hidden="true" aria-label="Commands and shortcuts">
        <header>
          <h2>Commands</h2>
          <button id="take-tour" class="link-btn strong" title="A short guided tour of NEWB">Take the tour</button>
          <button class="drawer-close" data-icon="close" title="Close (Esc)" aria-label="Close"></button>
        </header>
        <nav class="subtabs">
          <button class="subtab on" data-tab="tree">Cheat sheet</button>
          <button class="subtab" data-tab="keys">Shortcuts</button>
        </nav>

        <div id="panel-tree" class="panel">
          <input id="tree-filter" class="panel-input" type="search" placeholder="What do you want to do? e.g. copy a file" autocomplete="off" spellcheck="false">
          <div class="tree-tools">
            <button id="tree-expand" class="link-btn">Expand all</button>
            <button id="tree-collapse" class="link-btn">Collapse all</button>
            <button id="tree-add" class="link-btn strong" data-icon="plus" title="Make your own category of commands"><span>New category</span></button>
          </div>
          <div id="cheat-body" class="drawer-body"></div>
          <div id="cheat-results" class="drawer-body" hidden></div>
        </div>

        <div id="panel-keys" class="panel" hidden>
          <input id="keys-filter" class="panel-input" type="search" placeholder="Search shortcuts, e.g. copy" autocomplete="off" spellcheck="false">
          <div id="keys-body" class="drawer-body"></div>
        </div>
      </aside>

      <!-- Right-click menu for the terminal -->
      <div id="ctx-menu" class="ctx" hidden></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
