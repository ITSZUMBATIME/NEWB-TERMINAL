<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AKIN</title>
  </head>
  <body>
    <div id="app">
      <div id="tabbar">
        <button id="open-files" class="bar-btn" title="Files (Ctrl+Shift+E)">&#9703; Files</button>
        <div id="tabs"></div>
        <button id="new-tab" title="New tab (Ctrl+Shift+T)">+</button>
        <button id="open-cheats" class="bar-btn" title="Cheat sheet (Ctrl+Shift+S)">Cheat sheet &#9704;</button>
        <button id="open-display" class="bar-btn" title="Display: size and style (Ctrl + / Ctrl -)">Aa</button>
        <button id="toggle-info" title="Change the system info layout (Ctrl+Shift+I)">&#9432;</button>
      </div>

      <div id="hero" data-logo="code" data-layout="pinned">
        <div id="logo-wrap">
          <div class="logo" role="img" aria-label="AKIN" title="Click to try another logo style"></div>
          <canvas id="ascii-logo" title="Click to try another logo style"></canvas>
        </div>
        <div id="info">
          <div id="info-inner">
            <div id="info-title"></div>
            <div id="info-cols">
              <div class="col" id="info-left"></div>
              <div class="col" id="info-right"></div>
            </div>
            <div id="palette" class="palette"></div>
          </div>
        </div>
      </div>

      <div id="workspace">
        <!-- Left: file explorer. Docked, so it pushes the terminal across. -->
        <aside id="explorer" aria-label="Files" aria-hidden="false">
          <div class="fx-head">
            <button id="fx-home" class="fx-btn" title="Home folder">&#8962;</button>
            <button id="fx-up" class="fx-btn" title="Up one folder">&#8593;</button>
            <div id="fx-path" class="fx-path"></div>
            <button id="fx-follow" class="fx-btn" title="Follow the folder the terminal is in">&#9678;</button>
            <button id="fx-hidden" class="fx-btn" title="Show hidden files">&#9680;</button>
            <button id="fx-refresh" class="fx-btn" title="Refresh">&#8635;</button>
          </div>
          <div id="fx-tree" class="fx-tree"></div>
          <div id="fx-resize" class="fx-resize" title="Drag to resize"></div>
        </aside>
        <div id="panes"></div>
      </div>

      <div id="logo-toast"></div>

      <!-- Right: slide-over panel with all your commands -->
      <aside id="drawer-cheats" class="drawer right" aria-hidden="true" aria-label="Commands">
        <header><h2>Commands</h2><button class="drawer-close" title="Close (Esc)">&times;</button></header>
        <div id="panel-tree" class="panel">
          <input id="tree-filter" class="panel-input" type="search" placeholder="What do you want to do? e.g. copy a file" autocomplete="off" spellcheck="false">
          <div class="tree-tools">
            <button id="tree-expand" class="link-btn">Expand all</button>
            <button id="tree-collapse" class="link-btn">Collapse all</button>
          </div>
          <div id="cheat-body" class="drawer-body"></div>
          <div id="cheat-results" class="drawer-body" hidden></div>
        </div>
      </aside>

      <!-- Display settings: how big things are, and how the panels look -->
      <div id="display-pop" class="popover" hidden>
        <h3>Display</h3>

        <div class="pop-row">
          <label for="scale-range">Interface size</label>
          <span id="scale-val" class="pop-val">100%</span>
        </div>
        <div class="slider-row">
          <button id="scale-down" class="step-btn" title="Smaller (Ctrl -)">&minus;</button>
          <input id="scale-range" type="range" min="60" max="300" step="5" value="100">
          <button id="scale-up" class="step-btn" title="Bigger (Ctrl +)">+</button>
        </div>
        <p class="pop-hint">Makes everything bigger or smaller: buttons, icons, panels and text. Ctrl + and Ctrl - do the same.</p>

        <div class="pop-row">
          <label for="font-range">Terminal text</label>
          <span id="font-val" class="pop-val">14 px</span>
        </div>
        <div class="slider-row">
          <button id="font-down" class="step-btn" title="Smaller text">&minus;</button>
          <input id="font-range" type="range" min="9" max="32" step="1" value="14">
          <button id="font-up" class="step-btn" title="Bigger text">+</button>
        </div>

        <div class="pop-row"><label>Panel style</label></div>
        <div id="panel-style" class="seg">
          <button data-style="classic">Classic</button>
          <button data-style="flat">Flat</button>
          <button data-style="terminal">Terminal</button>
        </div>

        <button id="display-reset" class="link-btn">Reset to defaults</button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
