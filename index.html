<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AKIN</title>
  </head>
  <body>
    <div id="app">
      <div id="tabbar">
        <div id="tabs"></div>
        <button id="new-tab" title="New tab (Ctrl+Shift+T)">+</button>
        <button id="toggle-info" title="Show or hide system info (Ctrl+Shift+I)">&#9432;</button>
      </div>
      <div id="hero" data-logo="shimmer">
        <div id="logo-wrap"><div class="logo" role="img" aria-label="AKIN" title="Click to try another logo style"></div></div>
        <div id="logo-toast"></div>
        <div id="info">
          <div class="col" id="info-left"></div>
          <div class="col" id="info-right"></div>
        </div>
      </div>
      <div id="panes"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
